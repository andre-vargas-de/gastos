<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gasto Compartido</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#0F1310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0F1310;
    color: #E8E4D9;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  ::selection { background: #C9A876; color: #0F1310; }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .section-tabs {
    display: flex;
    gap: 4px;
    background: #12160F;
    border: 1px solid #22261F;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 18px;
  }
  .section-tab {
    flex: 1;
    padding: 9px 0;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: #8B8578;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .section-tab.active {
    background: #1E2418;
    color: #C9A876;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 18px;
    gap: 12px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .refresh-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #171B16;
    color: #C9A876;
    border: 1px solid #2A2E28;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .refresh-btn:active { transform: scale(0.97); }
  .refresh-btn svg { transition: transform 0.5s ease; }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sync-strip {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 11.5px;
    color: #6B6A5F;
  }
  .sync-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: #12160F;
    border: 1px solid #22261F;
    border-radius: 999px;
    padding: 5px 10px;
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #6B9B7A; flex-shrink: 0; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .tab-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid #2A2E28;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: #8B8578;
    white-space: nowrap;
    font-family: inherit;
  }
  .tab-btn.active { background: rgba(201,168,118,0.13); color: #C9A876; border-color: rgba(201,168,118,0.4); }
  .tab-btn.person-alvaro.active { background: rgba(79,209,197,0.13); color: #4FD1C5; border-color: rgba(79,209,197,0.4); }
  .tab-btn.person-camila.active { background: rgba(244,114,182,0.13); color: #F472B6; border-color: rgba(244,114,182,0.4); }

  .balance-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .balance-card {
    background: #171B16;
    border: 1px solid;
    border-radius: 14px;
    padding: 14px 14px 12px;
  }
  .balance-top { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .bank-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .bank-label { font-size: 12px; color: #8B8578; font-weight: 500; }
  .balance-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 19px;
    font-weight: 500;
    color: #E8E4D9;
    margin-bottom: 4px;
  }
  .balance-sub { font-size: 11.5px; color: #6B6A5F; }
  .balance-sub b { color: #E8E4D9; font-weight: 500; }

  .total-strip {
    background: linear-gradient(135deg, #1B2318, #171B16);
    border: 1px solid #2E3A28;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .total-strip .label { font-size: 12px; color: #8B8578; margin-bottom: 3px; }
  .total-strip .amount { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600; color: #C9A876; }

  .section { margin-bottom: 26px; }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: #8B8578;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .cat-row { margin-bottom: 12px; }
  .cat-label-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13.5px; }
  .cat-amt { font-family: 'IBM Plex Mono', monospace; color: #C9A876; font-size: 13px; }
  .cat-bar-bg { height: 6px; background: #1E2219; border-radius: 4px; overflow: hidden; }
  .cat-bar-fill { height: 100%; background: linear-gradient(90deg, #6B9B7A, #C9A876); border-radius: 4px; }

  .empty {
    padding: 32px 16px;
    text-align: center;
    color: #6B6A5F;
    font-size: 13.5px;
    border: 1px dashed #2A2E28;
    border-radius: 12px;
    line-height: 1.5;
  }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: #171B16;
    border: 1px solid #22261F;
    border-radius: 12px;
    padding: 12px;
  }
  .row-icon {
    width: 32px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 14px;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .row-note { font-size: 13.5px; color: #E8E4D9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-amount { font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; color: #E8756C; flex-shrink: 0; }
  .row-bottom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid; font-weight: 500; }
  .pill-alvaro { color: #4FD1C5; border-color: rgba(79,209,197,0.4); }
  .pill-camila { color: #F472B6; border-color: rgba(244,114,182,0.4); }
  .pill-muted { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid #2A2E28; color: #6B6A5F; }
  .row-date { font-size: 10.5px; color: #565549; margin-left: auto; }

  .tc-box {
    background: #171B16;
    border: 1px solid #2A2E28;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .tc-box label {
    display: block;
    font-size: 11.5px;
    color: #8B8578;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .tc-box input {
    width: 100%;
    background: #0F1310;
    border: 1px solid #2A2E28;
    border-radius: 10px;
    padding: 10px 12px;
    color: #C9A876;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 500;
  }

  .patrimonio-row {
    background: #171B16;
    border: 1px solid #22261F;
    border-radius: 12px;
    padding: 12px;
  }
  .patrimonio-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
    color: #E8E4D9;
  }
  .patrimonio-usd {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #6B9B7A;
  }
  .patrimonio-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .patrimonio-input-row input {
    flex: 1;
    background: #0F1310;
    border: 1px solid #2A2E28;
    border-radius: 8px;
    padding: 8px 10px;
    color: #E8E4D9;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
  }
  .moneda-tag {
    font-size: 11px;
    color: #6B6A5F;
    padding: 4px 8px;
    border: 1px solid #2A2E28;
    border-radius: 6px;
    flex-shrink: 0;
  }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: #4A4940;
    margin-top: 30px;
    line-height: 1.6;
  }

  .loading, .error-box {
    padding: 60px 20px;
    text-align: center;
    color: #6B6A5F;
    font-size: 13.5px;
  }
  .error-box { color: #E8756C; }

  @media (prefers-reduced-motion: reduce) {
    .refresh-btn.spinning svg { animation: none; }
  }
</style>
</head>
<body>
<div class="page" id="app">
  <div class="loading">Cargando gastos…</div>
</div>

<script>
/* ======================= CONFIGURACIÓN ======================= */
// Pega aquí el link CSV publicado de tu Google Sheet (menú Archivo > Compartir > Publicar en la Web > formato CSV)
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR3msUrckEJQC6NVDeTHErRiEdC0jvD7QVpmz6NLOA80hFeyuH4d3pi_RkZ3G-dJkcmd1WvBCYNGU72/pub?gid=1703586738&single=true&output=csv";

const BANK_META = {
  "BISA":  { label: "Banco BISA",  color: "#FFD400" },
  "Unión": { label: "Banco Unión", color: "#F2A900" },
  "Union": { label: "Banco Unión", color: "#F2A900" },
};
const PEOPLE = ["Andre", "Camila"];
const PERSON_CLASS = { "Andre": "alvaro", "Camila": "camila" };
const PERSON_COLOR = { "Andre": "#4FD1C5", "Camila": "#F472B6" };
// Camila solo opera con Banco Unión — sus movimientos con otro banco no deberían existir,
// pero por si acaso, esto se usa para filtrar qué bancos se muestran en su vista.
const PERSON_BANKS = { "Andre": ["BISA", "Unión"], "Camila": ["Unión"] };

let currentView = "shared";
let currentSection = "gastos"; // "gastos" | "patrimonio"
let expenses = [];

/* ======================= PATRIMONIO (ahorros totales) ======================= */
const PATRIMONIO_DEFAULT = {
  tipoCambio: 11.71, // Bs por 1 USD, editable a diario
  items: [
    { id: "cop", label: "Pesos colombianos (físico)", moneda: "COP", monto: 127000, tasaUsd: 3137.03 },
    { id: "ars", label: "Pesos argentinos (físico)", moneda: "ARS", monto: 750, tasaUsd: 1490.95 },
    { id: "brl", label: "Reales brasileños (físico)", moneda: "BRL", monto: 239, tasaUsd: 5.1495 },
    { id: "bob_fisico", label: "Bolivianos (físico)", moneda: "BOB", monto: 2000, tasaUsd: null },
    { id: "usd_fisico", label: "Dólares (físico)", moneda: "USD", monto: 901, tasaUsd: 1 },
    { id: "usd_dig1", label: "Dólares — billetera digital 1", moneda: "USD", monto: 802.61, tasaUsd: 1 },
    { id: "usd_dig2", label: "Dólares — billetera digital 2", moneda: "USD", monto: 131.04, tasaUsd: 1 },
    { id: "bob_digital", label: "Bolivianos — billetera digital", moneda: "BOB", monto: 5721.57, tasaUsd: null },
  ],
};

function loadPatrimonio() {
  try {
    const raw = localStorage.getItem("patrimonio_data");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(PATRIMONIO_DEFAULT));
}
function savePatrimonio(data) {
  localStorage.setItem("patrimonio_data", JSON.stringify(data));
}
let patrimonio = loadPatrimonio();

function itemToUsd(item, tipoCambioBob) {
  if (item.moneda === "USD") return item.monto;
  if (item.moneda === "BOB") return item.monto / tipoCambioBob;
  if (item.tasaUsd) return item.monto / item.tasaUsd;
  return 0;
}

/* ======================= UTILIDADES ======================= */
function fmtBs(n) {
  return "Bs " + Number(n).toLocaleString("es-BO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(d) {
  if (!(d instanceof Date) || isNaN(d)) return "";
  return d.toLocaleDateString("es-BO", { day: "2-digit", month: "short" });
}
function parseFechaTransaccion(str) {
  // Formatos esperados: "DD/MM/YYYY HH:MM:SS" o similar
  if (!str) return null;
  const m = str.match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}):(\d{2}))?/);
  if (!m) return new Date(str);
  const [, dd, mm, yyyy, hh = "00", mi = "00", ss = "00"] = m;
  return new Date(`${yyyy}-${mm}-${dd}T${hh}:${mi}:${ss}`);
}

// Parser CSV simple que respeta comillas
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && next === '\n') i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function rowsToExpenses(rows) {
  // Encabezados esperados: Registrado el | Fecha transacción | Persona | Banco | Monto (Bs) | Nota | Categoría
  if (!rows.length) return [];
  const body = rows.slice(1); // salta encabezado
  return body
    .filter(r => r.length >= 5 && r[4] && !isNaN(parseFloat(r[4])))
    .map(r => ({
      date: parseFechaTransaccion(r[1]) || new Date(r[0]),
      person: (r[2] || "").trim(),
      bank: (r[3] || "").trim(),
      amount: parseFloat(r[4]),
      note: (r[5] || "").trim(),
      category: (r[6] || "").trim(),
    }))
    .filter(e => e.person && e.bank);
}

/* ======================= CARGA DE DATOS ======================= */
async function loadExpenses(showSpinner) {
  const btn = document.getElementById("refresh-btn");
  if (btn && showSpinner) btn.classList.add("spinning");
  try {
    const res = await fetch(SHEET_CSV_URL + "&cachebust=" + Date.now());
    if (!res.ok) throw new Error("No se pudo leer la hoja");
    const text = await res.text();
    const rows = parseCSV(text);
    expenses = rowsToExpenses(rows).sort((a, b) => b.date - a.date);
    render();
  } catch (err) {
    document.getElementById("app").innerHTML =
      `<div class="error-box">No se pudo conectar con la hoja de gastos.<br>Revisa tu conexión e intenta de nuevo.</div>`;
    console.error(err);
  } finally {
    if (btn) setTimeout(() => btn.classList.remove("spinning"), 400);
  }
}

/* ======================= RENDER ======================= */
function render() {
  if (currentSection === "patrimonio") { renderPatrimonio(); return; }

  const filtered = currentView === "shared" ? expenses : expenses.filter(e => e.person === currentView);

  const totals = { BISA: 0, "Unión": 0 };
  filtered.forEach(e => {
    const key = e.bank === "Union" ? "Unión" : e.bank;
    if (totals[key] === undefined) totals[key] = 0;
    totals[key] += e.amount;
  });
  const grandTotal = filtered.reduce((s, e) => s + e.amount, 0);

  const byCat = {};
  filtered.forEach(e => {
    const cat = e.category || "Sin categoría";
    byCat[cat] = (byCat[cat] || 0) + e.amount;
  });
  const catEntries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const maxCat = catEntries.length ? catEntries[0][1] : 1;

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="section-tabs">
      <button class="section-tab ${currentSection === 'gastos' ? 'active' : ''}" onclick="setSection('gastos')">Gastos</button>
      <button class="section-tab ${currentSection === 'patrimonio' ? 'active' : ''}" onclick="setSection('patrimonio')">Patrimonio</button>
    </div>

    <header>
      <div>
        <h1>Gasto Compartido</h1>
      </div>
      <button class="refresh-btn" id="refresh-btn" onclick="loadExpenses(true)">
        ${refreshIcon()} Actualizar
      </button>
    </header>

    <div class="sync-strip">
      <div class="sync-pill"><span class="sync-dot"></span> Sincronizado con Gmail</div>
    </div>

    <div class="tabs">
      <button class="tab-btn ${currentView === 'shared' ? 'active' : ''}" onclick="setView('shared')">${usersIcon()} Compartida</button>
      ${PEOPLE.map(p => `
        <button class="tab-btn person-${PERSON_CLASS[p]} ${currentView === p ? 'active' : ''}" onclick="setView('${p}')">${userIcon()} ${p}</button>
      `).join("")}
    </div>

    <div class="total-strip">
      <div>
        <div class="label">${currentView === 'shared' ? 'Total gastado (los dos)' : 'Total gastado por ' + currentView}</div>
        <div class="amount">${fmtBs(grandTotal)}</div>
      </div>
    </div>

    <div class="balance-row">
      ${Object.entries(BANK_META)
        .filter((v, i, arr) => arr.findIndex(x => x[1].label === v[1].label) === i)
        .filter(([key]) => currentView === 'shared' || (PERSON_BANKS[currentView] || []).includes(key))
        .map(([key, meta]) => `
        <div class="balance-card" style="border-color:${meta.color}33">
          <div class="balance-top">
            <span class="bank-dot" style="background:${meta.color}"></span>
            <span class="bank-label">${meta.label}</span>
          </div>
          <div class="balance-amount">${fmtBs(totals[key] || 0)}</div>
          <div class="balance-sub">gastado ${currentView === 'shared' ? '(todos)' : '(' + currentView + ')'}</div>
        </div>
      `).join("")}
    </div>

    ${catEntries.length ? `
    <div class="section">
      <div class="section-title">Por categoría</div>
      ${catEntries.map(([cat, amt]) => `
        <div class="cat-row">
          <div class="cat-label-row">
            <span>${cat}</span>
            <span class="cat-amt">${fmtBs(amt)}</span>
          </div>
          <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${(amt / maxCat) * 100}%"></div></div>
        </div>
      `).join("")}
    </div>` : ""}

    <div class="section">
      <div class="section-title">Movimientos (${filtered.length})</div>
      ${filtered.length === 0 ? `
        <div class="empty">Sin gastos registrados todavía.<br>Aparecerán aquí automáticamente cuando llegue una notificación de pago QR.</div>
      ` : `
        <div class="list">
          ${filtered.map(e => rowHtml(e)).join("")}
        </div>
      `}
    </div>

    <div class="footer-note">Los datos se sincronizan automáticamente desde Gmail cada pocos minutos.<br>Toca "Actualizar" para ver los movimientos más recientes.</div>
  `;
}

function rowHtml(e) {
  const bankKey = e.bank === "Union" ? "Unión" : e.bank;
  const meta = BANK_META[bankKey] || { label: e.bank, color: "#8B8578" };
  const personClass = PERSON_CLASS[e.person] || "";
  const pillClass = personClass ? `pill-${personClass}` : "pill-muted";
  return `
    <div class="row">
      <div class="row-icon" style="background:${meta.color}22;color:${meta.color}">↓</div>
      <div class="row-main">
        <div class="row-top">
          <span class="row-note">${escapeHtml(e.note || e.category || "Gasto QR")}</span>
          <span class="row-amount">-${fmtBs(e.amount)}</span>
        </div>
        <div class="row-bottom">
          <span class="pill ${pillClass}">${escapeHtml(e.person)}</span>
          <span class="pill-muted">${meta.label}</span>
          ${e.category ? `<span class="pill-muted">${escapeHtml(e.category)}</span>` : ""}
          <span class="row-date">${fmtDate(e.date)}</span>
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setView(v) {
  currentView = v;
  render();
}

function setSection(s) {
  currentSection = s;
  render();
}

function updateTipoCambio(val) {
  const n = parseFloat(val);
  if (!isNaN(n) && n > 0) {
    patrimonio.tipoCambio = n;
    savePatrimonio(patrimonio);
    renderPatrimonio();
  }
}

function updateItemMonto(id, val) {
  const n = parseFloat(val);
  const item = patrimonio.items.find(i => i.id === id);
  if (item) {
    item.monto = isNaN(n) ? 0 : n;
    savePatrimonio(patrimonio);
    renderPatrimonio();
  }
}

function renderPatrimonio() {
  const app = document.getElementById("app");
  const tc = patrimonio.tipoCambio;

  const itemsConUsd = patrimonio.items.map(item => ({ ...item, usd: itemToUsd(item, tc) }));
  const totalUsd = itemsConUsd.reduce((s, i) => s + i.usd, 0);
  const totalBob = totalUsd * tc;

  app.innerHTML = `
    <div class="section-tabs">
      <button class="section-tab" onclick="setSection('gastos')">Gastos</button>
      <button class="section-tab active" onclick="setSection('patrimonio')">Patrimonio</button>
    </div>

    <header>
      <div><h1>Patrimonio Total</h1></div>
    </header>

    <div class="tc-box">
      <label for="tc-input">Tipo de cambio de hoy (Bs por 1 USD)</label>
      <input id="tc-input" type="number" step="0.01" value="${tc}"
        onchange="updateTipoCambio(this.value)" inputmode="decimal" />
    </div>

    <div class="total-strip" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div class="label">Total de ahorros</div>
      <div class="amount">$${totalUsd.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} USD</div>
      <div class="balance-sub" style="margin-top:2px">≈ ${fmtBs(totalBob)}</div>
    </div>

    <div class="section">
      <div class="section-title">Desglose (editable)</div>
      <div class="list">
        ${itemsConUsd.map(item => `
          <div class="patrimonio-row">
            <div class="patrimonio-label">
              <span>${escapeHtml(item.label)}</span>
              <span class="patrimonio-usd">≈ $${item.usd.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}</span>
            </div>
            <div class="patrimonio-input-row">
              <input type="number" step="0.01" value="${item.monto}"
                onchange="updateItemMonto('${item.id}', this.value)" inputmode="decimal" />
              <span class="moneda-tag">${item.moneda}</span>
            </div>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="footer-note">Edita cualquier monto o el tipo de cambio cuando quieras — se guarda automáticamente en este dispositivo.</div>
  `;
}
