<body>
<div class="page" id="app">
  <div class="loading">Cargando gastos…</div>
</div>

<script>
/* ======================= CONFIGURACIÓN ======================= */
// Link CSV publicado de la Google Sheet (Archivo > Compartir > Publicar en la Web > CSV), pestaña "Gastos"
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQveHGhs8QkZ5tNmljttm3rKZzRJsrqJfa7NFvSdEpLAt6feFYD6e9cderGCDct_et5e6P8vHFF-Rwt/pub?gid=1571806970&single=true&output=csv";

const BANK_META = {
  "BISA":  { label: "Banco BISA",  color: "#FFD400" },
  "Unión": { label: "Banco Unión", color: "#F2A900" },
  "Union": { label: "Banco Unión", color: "#F2A900" },
};
const PEOPLE = ["Álvaro", "Camila"];
const PERSON_CLASS = { "Álvaro": "alvaro", "Camila": "camila" };
// Camila solo opera con Banco Unión.
const PERSON_BANKS = { "Álvaro": ["BISA", "Unión"], "Camila": ["Unión"] };

// SALDO BASE por persona+banco: el saldo real que confirmaste en una fecha específica.
// La app SUMA los créditos y RESTA los débitos que aparezcan en la Sheet con fecha
// POSTERIOR a "fecha", para mostrar el saldo actualizado en tiempo real.
// Cuando el saldo real cambie por algo que la app no puede ver (ej. depósito en ventanilla),
// actualiza aquí el monto y la fecha para que sirva de nuevo punto de partida.
const SALDOS_BASE = {
  "Álvaro": {
    "Unión": { monto: 5721.57, fecha: "12/08/2026 00:00:00" },
    "BISA":  { monto: 41.89,  fecha: "12/08/2026 00:00:00" },
  },
  "Camila": {
    "Unión": null, // aún no sincronizado — se define aquí cuando ella confirme su saldo real
  },
};

let currentView = "shared";
let currentSection = "gastos"; // "gastos" | "patrimonio"
let expenses = [];
let lastUpdated = null;
let selectedMonthKey = null; // mes elegido en el dropdown de "Total gastado por mes"

/* ======================= PATRIMONIO (ahorros totales) ======================= */
const PATRIMONIO_DEFAULT = {
  tipoCambio: 11.71,   // Bs por 1 USD, editable a diario
  usdtRate: 0.999,     // USD por 1 USDT, editable
  items: [
    { id: "cop",         label: "Pesos colombianos (físico)", moneda: "COP", monto: 127000,  tasaUsd: 3137.03 },
    { id: "ars",         label: "Pesos argentinos (físico)",  moneda: "ARS", monto: 750,      tasaUsd: 1490.95 },
    { id: "brl",         label: "Reales brasileños (físico)", moneda: "BRL", monto: 239,      tasaUsd: 5.1495 },
    { id: "bob_fisico",  label: "Bolivianos (físico)",        moneda: "BOB", monto: 2000,     tasaUsd: null },
    { id: "usd_fisico",  label: "Dólares (físico)",           moneda: "USD", monto: 901,      tasaUsd: 1 },
    { id: "usd_dig1",    label: "Dólares — billetera digital 1", moneda: "USD", monto: 802.61, tasaUsd: 1 },
    { id: "usd_dig2",    label: "Dólares — billetera digital 2", moneda: "USD", monto: 131.04, tasaUsd: 1 },
    { id: "bob_digital", label: "Bolivianos — Banco Unión",  moneda: "BOB", monto: 5721.57,  tasaUsd: null },
    { id: "usdt",        label: "USDT",                       moneda: "USDT", monto: 40,      tasaUsd: null },
  ],
};

async function loadPatrimonio() {
  try {
    const res = await window.storage.get("patrimonio_data", true);
    if (res && res.value) return JSON.parse(res.value);
  } catch (e) {}
  return JSON.parse(JSON.stringify(PATRIMONIO_DEFAULT));
}
async function savePatrimonio() {
  try { await window.storage.set("patrimonio_data", JSON.stringify(patrimonio), true); }
  catch (e) { console.error("No se pudo guardar patrimonio", e); }
}
let patrimonio = null;

function itemToUsd(item, tipoCambioBob, usdtRate) {
  if (item.moneda === "USD") return item.monto;
  if (item.moneda === "USDT") return item.monto * usdtRate;
  if (item.moneda === "BOB") return item.monto / tipoCambioBob;
  if (item.tasaUsd) return item.monto / item.tasaUsd;
  return 0;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ======================= UTILIDADES ======================= */
function fmtBs(n) {
  return "Bs " + Number(n).toLocaleString("es-BO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(d) {
  if (!(d instanceof Date) || isNaN(d)) return "";
  return d.toLocaleDateString("es-BO", { day: "2-digit", month: "short" });
}
function parseFechaTransaccion(str) {
  if (!str) return null;

  // Formato ISO que a veces usa Sheets al exportar Date de Apps Script: "2026-08-11T20:58:25.000Z" o similar
  const isoMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})[T\s](\d{2}):(\d{2}):(\d{2})/);
  if (isoMatch) {
    const [, yyyy, mm, dd, hh, mi, ss] = isoMatch;
    return new Date(`${yyyy}-${mm}-${dd}T${hh}:${mi}:${ss}`);
  }

  // Los correos de BISA y Banco Unión siempre traen la fecha en formato boliviano DD/MM/YYYY.
  // Se respeta ese formato directo, sin adivinar — solo se corrige si el día indicado no es
  // válido como día (>12 en la posición de mes ya lo confirma; si no, se usa DD/MM tal cual).
  const m = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}):(\d{2}))?/);
  if (!m) return null; // formato no reconocido — mejor descartar que arriesgar una fecha mal interpretada
  const [, a, b, yyyy, hh = "00", mi = "00", ss = "00"] = m;
  let dd = parseInt(a, 10), mm = parseInt(b, 10);
  // Si "mes" resulta inválido (>12) pero "día" sí podría ser mes, se intercambia (caso borde defensivo)
  if (mm > 12 && dd <= 12) { const t = dd; dd = mm; mm = t; }

  return new Date(`${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}T${hh}:${mi}:${ss}`);
}

function parseMesFallback(mesStr) {
  // Columna "Mes" viene como "yyyy-MM" (la genera el propio script, sin ambigüedad de formato)
  if (!mesStr) return null;
  const m = String(mesStr).match(/^(\d{4})-(\d{2})$/);
  if (!m) return null;
  return new Date(parseInt(m[1]), parseInt(m[2]) - 1, 1);
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && next === '\n') i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function rowsToExpenses(rows) {
  // Encabezados esperados: Registrado el | Fecha transacción | Mes | Persona | Banco | Tipo | Monto (Bs) | Nota | Categoría
  if (!rows.length) return [];
  const body = rows.slice(1);
  return body
    .filter(r => r.length >= 7 && r[6] && !isNaN(parseFloat(r[6])))
    .map(r => ({
      date: parseFechaTransaccion(r[1]) || parseMesFallback(r[2]),
      person: (r[3] || "").trim(),
      bank: (r[4] || "").trim(),
      type: (r[5] || "Débito").trim(),
      amount: parseFloat(r[6]),
      note: (r[7] || "").trim(),
      category: (r[8] || "").trim(),
    }))
    .filter(e => e.person && e.bank);
}

/* ======================= CARGA DE DATOS ======================= */
async function loadExpenses(showSpinner) {
  const btn = document.getElementById("refresh-btn");
  if (btn && showSpinner) btn.classList.add("spinning");
  try {
    const res = await fetch(SHEET_CSV_URL + "&cachebust=" + Date.now());
    if (!res.ok) throw new Error("No se pudo leer la hoja");
    const text = await res.text();
    const rows = parseCSV(text);
    expenses = rowsToExpenses(rows).sort((a, b) => {
      const ta = (a.date instanceof Date && !isNaN(a.date)) ? a.date.getTime() : -Infinity;
      const tb = (b.date instanceof Date && !isNaN(b.date)) ? b.date.getTime() : -Infinity;
      return tb - ta;
    });
    lastUpdated = new Date();
    render();
  } catch (err) {
    document.getElementById("app").innerHTML =
      `<div class="error-box">No se pudo conectar con la hoja de gastos.<br>Revisa tu conexión e intenta de nuevo.</div>`;
    console.error(err);
  } finally {
    if (btn) setTimeout(() => btn.classList.remove("spinning"), 400);
  }
}

/* ======================= RENDER ======================= */
function render() {
  if (currentSection === "patrimonio") { renderPatrimonio(); return; }

  // Solo Débitos cuentan como "gasto"; los Créditos (como el sueldo) se muestran aparte, no se restan del saldo mostrado.
  const filtered = (currentView === "shared" ? expenses : expenses.filter(e => e.person === currentView))
    .filter(e => currentView === "shared" || (PERSON_BANKS[currentView] || []).includes(normBank(e.bank)));

  const gastos = filtered.filter(e => e.type !== "Crédito");
  const ingresos = filtered.filter(e => e.type === "Crédito");

  const totals = { BISA: 0, "Unión": 0 };
  gastos.forEach(e => {
    const key = normBank(e.bank);
    if (totals[key] === undefined) totals[key] = 0;
    totals[key] += e.amount;
  });
  const grandTotal = gastos.reduce((s, e) => s + e.amount, 0);
  const grandIngresos = ingresos.reduce((s, e) => s + e.amount, 0);

  // Total gastado agrupado por mes (más reciente primero)
  const byMonth = {};
  gastos.forEach(e => {
    if (!(e.date instanceof Date) || isNaN(e.date)) return;
    const key = e.date.getFullYear() + "-" + String(e.date.getMonth() + 1).padStart(2, "0");
    byMonth[key] = (byMonth[key] || 0) + e.amount;
  });
  const monthEntries = Object.entries(byMonth).sort((a, b) => b[0].localeCompare(a[0]));
  const monthLabel = (key) => {
    const [y, m] = key.split("-");
    const d = new Date(parseInt(y), parseInt(m) - 1, 1);
    const label = d.toLocaleDateString("es-BO", { month: "long", year: "numeric" });
    return label.charAt(0).toUpperCase() + label.slice(1);
  };
  // Si no hay mes seleccionado o el seleccionado ya no existe en los datos, usa el más reciente
  if (!selectedMonthKey || !byMonth[selectedMonthKey]) {
    selectedMonthKey = monthEntries.length ? monthEntries[0][0] : null;
  }

  const byCat = {};
  gastos.forEach(e => {
    const cat = e.category || "Sin categoría";
    byCat[cat] = (byCat[cat] || 0) + e.amount;
  });
  const catEntries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const maxCat = catEntries.length ? catEntries[0][1] : 1;

  const bancosVisibles = currentView === "shared" ? ["BISA", "Unión"] : (PERSON_BANKS[currentView] || []);

  // Saldo dinámico = saldo base (confirmado a una fecha) + créditos posteriores - débitos posteriores.
  function saldoPersonaBanco(persona, banco) {
    const base = (SALDOS_BASE[persona] || {})[banco];
    if (!base) return null;
    const fechaBase = parseFechaTransaccion(base.fecha);
    let saldo = base.monto;
    expenses.forEach(e => {
      if (e.person !== persona) return;
      if (normBank(e.bank) !== banco) return;
      if (!(e.date instanceof Date) || isNaN(e.date)) return;
      if (fechaBase && e.date <= fechaBase) return; // ya estaba incluido en el saldo base
      saldo += (e.type === "Crédito") ? e.amount : -e.amount;
    });
    return saldo;
  }
  function saldoDe(banco) {
    if (currentView === "shared") {
      let total = 0, algunoConocido = false;
      PEOPLE.forEach(p => {
        const v = saldoPersonaBanco(p, banco);
        if (v !== null) { total += v; algunoConocido = true; }
      });
      return algunoConocido ? total : null;
    }
    return saldoPersonaBanco(currentView, banco);
  }

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="section-tabs">
      <button class="section-tab ${currentSection === 'gastos' ? 'active' : ''}" onclick="setSection('gastos')">Gastos</button>
      <button class="section-tab ${currentSection === 'patrimonio' ? 'active' : ''}" onclick="setSection('patrimonio')">Patrimonio</button>
    </div>

    <header>
      <div><h1>Gasto Compartido</h1></div>
      <button class="refresh-btn" id="refresh-btn" onclick="loadExpenses(true)">
        ${refreshIcon()} Actualizar
      </button>
    </header>

    <div class="sync-strip">
      <div class="sync-pill"><span class="sync-dot"></span> Sincronizado con Gmail</div>
      <span class="sync-updated">${lastUpdated ? "Actualizado " + lastUpdated.toLocaleTimeString('es-BO', {hour:'2-digit', minute:'2-digit'}) : ""}</span>
    </div>

    <div class="tabs">
      <button class="tab-btn ${currentView === 'shared' ? 'active' : ''}" onclick="setView('shared')">${usersIcon()} Compartida</button>
      ${PEOPLE.map(p => `
        <button class="tab-btn person-${PERSON_CLASS[p]} ${currentView === p ? 'active' : ''}" onclick="setView('${p}')">${userIcon()} ${p}</button>
      `).join("")}
    </div>

    <div class="total-strip">
      <div>
        <div class="label">${currentView === 'shared' ? 'Total gastado (los dos)' : 'Total gastado por ' + currentView}</div>
        <div class="amount">${fmtBs(grandTotal)}</div>
      </div>
      ${grandIngresos > 0 ? `<div style="text-align:right"><div class="label">Ingresos</div><div class="amount" style="color:#6B9B7A;font-size:16px">+${fmtBs(grandIngresos)}</div></div>` : ""}
    </div>

    <div class="balance-row">
      ${bancosVisibles.map(key => {
        const meta = BANK_META[key];
        const saldo = saldoDe(key);
        const esCamilaSinSincronizar = currentView === 'Camila' && saldo === null;
        return `
        <div class="balance-card" style="border-color:${meta.color}33">
          <div class="balance-top">
            <span class="bank-dot" style="background:${meta.color}"></span>
            <span class="bank-label">${meta.label}</span>
          </div>
          <div class="balance-amount">${saldo !== null ? fmtBs(saldo) : "—"}</div>
          <div class="balance-sub">${esCamilaSinSincronizar ? "cuenta aún no sincronizada" : (saldo !== null ? "saldo actualizado automáticamente" : "")}</div>
          <div class="balance-sub" style="margin-top:4px">gastado ${currentView === 'shared' ? '(todos)' : '(' + currentView + ')'}: <b>${fmtBs(totals[key] || 0)}</b></div>
        </div>
      `;}).join("")}
    </div>

    ${monthEntries.length ? `
    <div class="section">
      <div class="section-title">Total gastado por mes</div>
      <div class="month-select-box">
        <select id="month-select" onchange="setSelectedMonth(this.value)">
          ${monthEntries.map(([key]) => `
            <option value="${key}" ${key === selectedMonthKey ? "selected" : ""}>${monthLabel(key)}</option>
          `).join("")}
        </select>
        <div class="month-amount">${fmtBs(byMonth[selectedMonthKey] || 0)}</div>
      </div>
    </div>` : ""}

    ${catEntries.length ? `
    <div class="section">
      <div class="section-title">Por categoría</div>
      ${catEntries.map(([cat, amt]) => `
        <div class="cat-row">
          <div class="cat-label-row"><span>${cat}</span><span class="cat-amt">${fmtBs(amt)}</span></div>
          <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${(amt / maxCat) * 100}%"></div></div>
        </div>
      `).join("")}
    </div>` : ""}

    <div class="section">
      <div class="section-title">Movimientos (${filtered.length})</div>
      ${filtered.length === 0 ? `
        <div class="empty">Sin movimientos todavía.<br>Aparecerán aquí automáticamente cuando llegue una notificación de pago QR.</div>
      ` : `
        <div class="list">${filtered.map(e => rowHtml(e)).join("")}</div>
      `}
    </div>

    <div class="footer-note">Los movimientos se sincronizan desde Gmail cada pocos minutos.<br>Los saldos de cuenta se actualizan manualmente. Toca "Actualizar" para ver lo más reciente.</div>
  `;
}

function normBank(b) { return b === "Union" ? "Unión" : b; }

function rowHtml(e) {
  const bankKey = normBank(e.bank);
  const meta = BANK_META[bankKey] || { label: e.bank, color: "#8B8578" };
  const personClass = PERSON_CLASS[e.person] || "";
  const pillClass = personClass ? `pill-${personClass}` : "pill-muted";
  const esCredito = e.type === "Crédito";
  return `
    <div class="row">
      <div class="row-icon ${esCredito ? 'credito' : ''}" style="background:${meta.color}22;color:${meta.color}">↓</div>
      <div class="row-main">
        <div class="row-top">
          <span class="row-note">${escapeHtml(e.note || e.category || "Movimiento QR")}</span>
          <span class="row-amount ${esCredito ? 'credito' : ''}">${esCredito ? '+' : '-'}${fmtBs(e.amount)}</span>
        </div>
        <div class="row-bottom">
          <span class="pill ${pillClass}">${escapeHtml(e.person)}</span>
          <span class="pill-muted">${meta.label}</span>
          ${e.category ? `<span class="pill-muted">${escapeHtml(e.category)}</span>` : ""}
          <span class="row-date">${fmtDate(e.date)}</span>
        </div>
      </div>
    </div>
  `;
}

/* ======================= RENDER: PATRIMONIO ======================= */
function renderPatrimonio() {
  const app = document.getElementById("app");
  if (!patrimonio) { app.innerHTML = `<div class="loading">Cargando patrimonio…</div>`; return; }

  const tc = patrimonio.tipoCambio;
  const usdtRate = patrimonio.usdtRate;
  const itemsConUsd = patrimonio.items.map(item => ({ ...item, usd: itemToUsd(item, tc, usdtRate) }));
  const totalUsd = itemsConUsd.reduce((s, i) => s + i.usd, 0);
  const totalBob = totalUsd * tc;

  app.innerHTML = `
    <div class="section-tabs">
      <button class="section-tab" onclick="setSection('gastos')">Gastos</button>
      <button class="section-tab active" onclick="setSection('patrimonio')">Patrimonio</button>
    </div>

    <header><div><h1>Patrimonio Total</h1></div></header>

    <div class="tc-box">
      <div class="tc-row">
        <div class="tc-field">
          <label for="tc-input">Tipo de cambio (Bs por 1 USD)</label>
          <input id="tc-input" type="number" step="0.01" value="${tc}" onchange="updateTipoCambio(this.value)" inputmode="decimal" />
        </div>
        <div class="tc-field">
          <label for="usdt-input">Cotización USDT (USD por 1 USDT)</label>
          <input id="usdt-input" type="number" step="0.0001" value="${usdtRate}" onchange="updateUsdtRate(this.value)" inputmode="decimal" />
        </div>
      </div>
    </div>

    <div class="patrimonio-total-strip">
      <div class="label">Total de ahorros</div>
      <div class="amount">$${totalUsd.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} USD</div>
      <div class="sub-amount">≈ ${fmtBs(totalBob)}</div>
    </div>

    <div class="section">
      <div class="section-title">Añadir dinero al patrimonio</div>
      <div class="add-item-box">
        <div class="add-item-row">
          <input id="new-item-label" type="text" placeholder="Ej: Efectivo en caja fuerte" />
        </div>
        <div class="add-item-row">
          <input id="new-item-monto" type="number" step="0.01" placeholder="Monto" inputmode="decimal" />
          <select id="new-item-moneda">
            <option value="BOB">BOB</option>
            <option value="USD">USD</option>
            <option value="USDT">USDT</option>
            <option value="COP">COP</option>
            <option value="ARS">ARS</option>
            <option value="BRL">BRL</option>
            <option value="EUR">EUR</option>
            <option value="OTRA">OTRA</option>
          </select>
        </div>
        <div class="add-item-row" id="new-item-tasa-row">
          <input id="new-item-tasa" type="number" step="0.0001" placeholder="Tasa: cuánto de esa moneda = 1 USD" inputmode="decimal" />
        </div>
        <div class="add-item-row">
          <button class="add-item-btn" onclick="addPatrimonioItem()" style="width:100%">+ Añadir al patrimonio</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Desglose (editable)</div>
      <div class="list">
        ${itemsConUsd.map(item => `
          <div class="patrimonio-row">
            <div class="patrimonio-main">
              <div class="patrimonio-label">
                <span>${escapeHtml(item.label)}</span>
                <span class="patrimonio-usd">≈ $${item.usd.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}</span>
              </div>
              <div class="patrimonio-input-row">
                <input type="number" step="0.01" value="${item.monto}" onchange="updateItemMonto('${item.id}', this.value)" inputmode="decimal" />
                <span class="moneda-tag">${item.moneda}</span>
              </div>
            </div>
            <button class="patrimonio-del" onclick="deletePatrimonioItem('${item.id}')" aria-label="Eliminar">✕</button>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="footer-note">Edita cualquier monto, añade nuevas entradas, o quita las que ya no correspondan.<br>Todo se guarda automáticamente y es visible para ambos.</div>
  `;

  // Mostrar/ocultar campo de tasa según la moneda elegida en "añadir"
  const selMoneda = document.getElementById("new-item-moneda");
  const tasaRow = document.getElementById("new-item-tasa-row");
  function toggleTasaRow() {
    const v = selMoneda.value;
    tasaRow.style.display = (v === "USD" || v === "BOB" || v === "USDT") ? "none" : "flex";
  }
  selMoneda.addEventListener("change", toggleTasaRow);
  toggleTasaRow();
}

async function updateTipoCambio(val) {
  const n = parseFloat(val);
  if (!isNaN(n) && n > 0) { patrimonio.tipoCambio = n; await savePatrimonio(); renderPatrimonio(); }
}
async function updateUsdtRate(val) {
  const n = parseFloat(val);
  if (!isNaN(n) && n > 0) { patrimonio.usdtRate = n; await savePatrimonio(); renderPatrimonio(); }
}
async function updateItemMonto(id, val) {
  const n = parseFloat(val);
  const item = patrimonio.items.find(i => i.id === id);
  if (item) { item.monto = isNaN(n) ? 0 : n; await savePatrimonio(); renderPatrimonio(); }
}
async function deletePatrimonioItem(id) {
  patrimonio.items = patrimonio.items.filter(i => i.id !== id);
  await savePatrimonio();
  renderPatrimonio();
}
async function addPatrimonioItem() {
  const label = document.getElementById("new-item-label").value.trim();
  const monto = parseFloat(document.getElementById("new-item-monto").value);
  const moneda = document.getElementById("new-item-moneda").value;
  const tasaInput = document.getElementById("new-item-tasa").value;
  const tasa = tasaInput ? parseFloat(tasaInput) : null;

  if (!label || isNaN(monto)) return;
  if (moneda !== "USD" && moneda !== "BOB" && moneda !== "USDT" && (!tasa || tasa <= 0)) {
    alert("Indica la tasa de conversión a USD para esta moneda (cuánto equivale 1 USD).");
    return;
  }

  patrimonio.items.push({ id: uid(), label, moneda, monto, tasaUsd: (moneda === "USD" || moneda === "BOB" || moneda === "USDT") ? null : tasa });
  await savePatrimonio();
  renderPatrimonio();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setView(v) { currentView = v; render(); }
function setSection(s) { currentSection = s; render(); }
function setSelectedMonth(key) { selectedMonthKey = key; render(); }

function refreshIcon() {
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>`;
}
function usersIcon() {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`;
}
function userIcon() {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
}

/* ======================= INICIO ======================= */
(async function init() {
  patrimonio = await loadPatrimonio();
  await loadExpenses(false);
  setInterval(() => loadExpenses(false), 60000);
})();
</script>
</body>
</html>
